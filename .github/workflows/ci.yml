name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. Pushing three times in a minute used to start three full gates and let all
# of them finish, so the queue filled with answers about commits nobody was waiting on any more —
# and the answer that mattered, the newest one, came last. `main` is exempt: a push there is a
# merge, and cancelling the gate on a merge would leave the branch with no result at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The gate runs as parallel jobs, and `build` gives its one answer. As a single job it took 12½
# minutes on #520 (7 November 2026), eight of them the coverage run, and every other step waited
# behind it. Now the checks, the site's build with its browser tests, and four slices of the unit
# tests run side by side, and one job merges the slices' coverage and holds it to the thresholds
# in vite.config.ts, as the single run did.
#
# The slices are chosen, not left to `--shard`: Vitest shards by a hash of each file's path, and
# that put the two slowest files, the board-parity tests of a minute or more each, in the same
# shard of four. The live boards' tests are a slice of their own; the rest of the lib project is
# one more; the components are split in two. Every test file lands in exactly one, and the merge
# checks that the count of files it got is the count the suite has.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: live
            select: --project lib src/lib/live/
          - slice: lib
            select: --project lib --exclude 'src/lib/live/**'
          - slice: components-1
            select: --project components --shard=1/2
          - slice: components-2
            select: --project components --shard=2/2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Coverage is gathered here and judged once, merged, in `coverage`: a slice covers part of the
      # code, so its own thresholds are set to nothing and its own summary goes to a file.
      - name: Unit tests, ${{ matrix.slice }}
        run: >-
          npx vitest --run --coverage
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0
          --coverage.reporter=json-summary
          --reporter=default --reporter=blob
          --outputFile.blob=blob-reports/${{ matrix.slice }}.json
          ${{ matrix.select }}
      - uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.slice }}
          path: blob-reports/
          retention-days: 1

  coverage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: blob-reports
          merge-multiple: true
      # Coverage rather than a bare run: same tests, same time, and the summary is printed in the
      # log so what the suite misses is visible on every pull request. The thresholds in
      # vite.config.ts are a floor under where the suite already is, so this fails on a real drop.
      - name: The slices' coverage, merged and held to the thresholds
        run: npx vitest --merge-reports=blob-reports --coverage --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/merged.json"
      # A slice that matched nothing, or two that matched the same file, would pass every test
      # it ran. So the merged report must hold each of the suite's test files, and each once.
      - name: Every test file ran, and once
        run: |
          expected=$(npx vitest list --filesOnly | wc -l)
          ran=$(node -e 'console.log(require(process.argv[1]).testResults.length)' "$RUNNER_TEMP/merged.json")
          echo "Test files run: $ran of the suite's $expected"
          test "$ran" -eq "$expected"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # What a visit downloads, held to limits: the first download, each League view's own load,
      # Team Rankings and the stylesheet (`scripts/bundleBudget.mjs`). Fails naming what grew.
      - run: npm run bundle:check
      - name: Vercel serves a static app and both API defaults are Firebase
        run: |
          test ! -d api
          grep -q 'name="gc-proxy-endpoint" content="https://us-central1-league-forecast-youth.cloudfunctions.net/gcTeam"' dist/index.html
          grep -q 'name="league-summary-endpoint" content="https://us-central1-league-forecast-youth.cloudfunctions.net/leagueSummary"' dist/index.html
      # The GameChanger proxy's address is a build setting (`gcProxyEndpoint`), and Vite fills in
      # `import.meta.env.VITE_…` only where the read is written out whole. Read any other way it
      # passes every unit test, which run with an `import.meta.env` of their own, and the setting
      # never reaches a browser. So build once with it set and look for it in the bundle, and in
      # the page's content policy, without which the browser refuses every call to it
      # (`src/lib/contentPolicy.ts`).
      - name: The proxy setting reaches the bundle and the page's policy
        run: |
          VITE_GC_PROXY_URL=https://proxy.example.invalid/gcTeam npx vite build --outDir "$RUNNER_TEMP/dist-proxy"
          grep -rlq "proxy.example.invalid/gcTeam" --include="*.js" "$RUNNER_TEMP/dist-proxy"
          grep -q "connect-src 'self' https://proxy.example.invalid" "$RUNNER_TEMP/dist-proxy/index.html"
      # The Firebase project the cloud copy lives in (`FIREBASE_WEB_CONFIG`,
      # docs/data/every-device.md "Your data on every device") is in the app's own build (`npm run
      # build`, above) and in its page's policy for Google sign-in, the project read out of the
      # source rather than written here again. And Firebase stays out of the first download. It is
      # loaded for a browser that signs in, so neither the entry script nor anything it preloads may
      # carry it.
      - name: The Firebase project reaches the page's policy, and Firebase loads only on sign-in
        run: |
          auth=$(node --input-type=module -e 'const { FIREBASE_WEB_CONFIG } = await import("./src/lib/cloud/cloudConfig.ts"); console.log(FIREBASE_WEB_CONFIG.authDomain);')
          test -n "$auth"
          grep -rlqF "$auth" --include="*.js" dist
          grep -qF "frame-src 'self' https://$auth" dist/index.html
          for file in $(grep -o 'assets/[^"]*\.js' dist/index.html); do
            if grep -q "firestore.googleapis.com" "dist/$file"; then
              echo "::error::Firebase is in the first download: $file"
              exit 1
            fi
          done
          grep -rlq "firestore.googleapis.com" --include="*.js" dist/assets
          # Firestore's listener is a chunk of its own, which a live board loads and the service
          # worker does not store ahead (`vite.config.ts`).
          ls dist/assets/firestoreListen-*.js
          if grep -q "firestoreListen-" dist/sw.js; then
            echo "::error::The service worker stores Firestore's listener ahead"
            exit 1
          fi
      # One browser, the specs in e2e/, against the build above: a season loads, a score moves the
      # standings, and the backup carries it. The unit suites cover the pieces; this covers the wiring.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The gate's one answer, under the name the single job had. It runs when a part before it failed,
  # since a job skipped because one it needs failed reads as passed, and says which part it was.
  build:
    needs: [checks, tests, coverage, site]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the gate passed
        run: |
          echo "checks: ${{ needs.checks.result }}, tests: ${{ needs.tests.result }}, coverage: ${{ needs.coverage.result }}, site: ${{ needs.site.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.coverage.result }}" = success
          test "${{ needs.site.result }}" = success
