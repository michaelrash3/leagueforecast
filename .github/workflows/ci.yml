name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Coverage rather than a bare run: same tests, same time, and the summary is printed in the
      # log so what the suite misses is visible on every pull request. Nothing fails on it yet -
      # see the note in vite.config.ts.
      - run: npm run test:coverage
      - run: npm run build
      # One browser, one smoke spec, against the build above: a season loads, a score moves the
      # standings, and the backup carries it. The unit suites cover the pieces; this covers the wiring.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
