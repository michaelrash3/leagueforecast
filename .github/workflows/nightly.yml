# The nightly refresh (README, "The nightly refresh on GitHub"): the Refresh button pressed on the
# cloud copy by one of GitHub's servers (`scripts/nightly.ts`), so every device opens on teams
# pulled overnight. It can also be run by hand, as a dry run or live, with a limit for a trial. It
# prints counts, sizes and timings only: this repository is public, and so are its Actions logs.
#
# A night that fails opens an issue on this repository, or comments on the one already open, and
# the next live night that succeeds closes it; the rebuilds after saves get one of their own while
# their ledger shows failures in a row or a pause (`scripts/alarm.ts`, README "When a run fails").
#
# Once a week, as of its Monday, the first run of the week (by the members' day it starts on) that
# finds it not yet made also re-measures where a rating starts, on the pool it has just published
# from, and keeps the answer for the Model check card. A level
# clearly better than the one held opens an issue of its own saying a change is ready; the level
# changes only by a commit (README, "Where a rating starts"). It prints numbers only. On the
# owner's backup of 11 October 2026 it took 20 s and about 1 GB above the loaded pool, measured
# off this runner.
name: Nightly refresh

on:
  # 04:17 UTC: 12:17 in the morning Eastern in summer, 11:17 at night in winter. Off the hour, since
  # GitHub starts a run late when every repository's is due at once. Even so it has been starting
  # this one about seven hours late (set for 07:17 UTC, it began between 14:09 and 14:33 UTC on 6 to
  # 9 October 2026), so it is set three hours earlier than the 3:17 it used to be. The run works out
  # its day in Eastern time (TZ below), so a winter run before midnight counts as the day it starts.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run does everything but save; live saves to the cloud copy"
        type: choice
        options: [dry-run, live]
        default: live
      limit:
        description: "Only the first this many teams due (blank for every one)"
        type: string
        default: ""

permissions:
  contents: read
  # The alarms' issues, opened, commented on and closed with the run's own token.
  issues: write

# One at a time: two runs saving the same copy would only make each other file again.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A run on the clock is live; one by hand is what was chosen.
      MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # No install: everything it runs is the app's own files, run by Node as they are
      # (`scripts/tsRegister.mjs`).
      - name: Refresh the cloud copy
        id: refresh
        # Short of the job's 90, so a run that hangs ends here as a failure and the alarm after it
        # still has its minutes.
        timeout-minutes: 85
        run: |
          args=()
          if [ "$MODE" = "live" ]; then args+=(--live); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          npm run nightly -- "${args[@]}"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # The user's day, which is what the rota and the day log are kept in.
          TZ: America/New_York
          # The collation the members' browsers sort tied board rows by, pinned rather than left to
          # the runner's image: Node takes it from LANG (unset, C and C.UTF-8 give English, an
          # empty LANG the root one), and the publish refuses under any other (`publishCopy.ts`).
          LANG: en_US.UTF-8
          # The whole pool is held at once; measured at about 4.3 GB on the pool of 29 September
          # 2026, on a runner with 16 GB. Monday's re-measure of where a rating starts adds about
          # 1 GB above the loaded pool (the owner's backup of 11 October, not measured here).
          NODE_OPTIONS: --max-old-space-size=12288
          LIMIT: ${{ inputs.limit }}
          # Whether the pulls run on GitHub: the deploy hands this token to the functions, and with it
          # no rebuild after a save runs on Google (`rebuildsRun`), the boards' publish on GitHub
          # taking their place, which the rebuilds' lines then say (`describeRebuilds`). Only
          # whether the secret is set, never the token itself.
          PULLS_ON_GITHUB: ${{ secrets.PULL_DISPATCH_TOKEN != '' }}
      # Beside the refresh, whatever became of it: the project's billing, read from Cloud Billing
      # (free to ask, and nothing of the copy), and the end of the token the pulls on GitHub are
      # started with, read from GitHub (`scripts/upkeep.ts`). Each is handed to the alarm as a word;
      # one not read is handed as nothing, which leaves its alarm as it is. It never fails the run.
      - name: Read the billing and the pull dispatch token
        id: upkeep
        if: always()
        continue-on-error: true
        run: npm run upkeep
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PULL_DISPATCH_TOKEN: ${{ secrets.PULL_DISPATCH_TOKEN }}
      # However the refresh ended: what is raised or settled, and every word of it, is the script's
      # (`runAlarms.ts`), from the step's outcome and the words the refresh handed over: the
      # rebuilds', and once a week the starting level's re-measure.
      # Allowed to fail on its own (gh refused, say) without failing the run: a night that saved
      # stays green, and GitHub does not email that it failed, for want of an issue; a night whose
      # refresh failed is red from that step already.
      - name: Raise or settle the alarms
        if: always()
        continue-on-error: true
        run: npm run alarm -- nightly
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.refresh.outcome }}
          REBUILDS: ${{ steps.refresh.outputs.rebuilds }}
          CLOSED_LEVEL: ${{ steps.refresh.outputs.closedLevel }}
          HELD: ${{ steps.refresh.outputs.held }}
          INGEST: ${{ steps.refresh.outputs.ingest }}
          BILLING: ${{ steps.upkeep.outputs.billing }}
          DISPATCH: ${{ steps.upkeep.outputs.dispatch }}
