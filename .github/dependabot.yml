# Keeps dependencies current without letting them drift silently.
#
# Every update arrives as a pull request that CI builds, type-checks, lints and tests before it can
# merge — which is the point: "up to date" is only safe when something proves the update works
# first. Patch and minor updates are batched into one PR a week so routine currency costs one
# review; major updates are deliberately excluded (see below) because each one is a migration.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole safe batch rather than a stream of single-package PRs.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors are deliberately NOT ignored. Each arrives as its own pull request, which CI builds,
    # type-checks, lints and tests before it can merge — so the cost of one that does not work is a
    # red check, not a broken app. Two are blocked upstream as of September 2026, and the point of
    # letting them through is that Dependabot will say so the day that changes:
    #
    #   eslint 10       eslint-plugin-jsx-a11y peers ^9 (the one npm stops on), and behind it
    #                   eslint-plugin-react peers ^9.7. eslint-plugin-react-hooks already peers
    #                   ^10, so it is those two that decide when this can move.
    #   typescript 7    typescript-eslint declares typescript >=4.8.4 <6.1.0
    #
    # Those PRs will fail to install until the upstream plugins catch up. That failure is the
    # signal, and it costs nothing; forcing any of them through with --legacy-peer-deps would buy
    # a version number at the price of a dependency tree npm itself calls potentially broken.
    #
    # Two things about reading these failures, both learned the hard way here:
    #
    # A red PR is not evidence the *package* is blocked — it is evidence that package is blocked
    # against the base branch it was opened on. vite 8 and @vitejs/plugin-react 6 each looked
    # blocked while the other was on 7; each installs, builds, lints and tests clean now that the
    # base carries the other. A single-package PR that goes red the day a peer moves is stale, not
    # stuck, and a rebase is the whole fix. When one of these is red, re-resolve it against current
    # main before believing the reason — trusting a stale note is what put the wrong reason here.
    #
    # And some packages move in lockstep: eslint and @eslint/js peer each other, so Dependabot's
    # single-package PR for either one fails on the other's 9, which reads like two problems and
    # is one. Merging both together does not help — jsx-a11y still refuses.
    commit-message:
      prefix: deps

  # The workflow's own actions age too, and a pinned action that stops being maintained is the
  # kind of thing nobody notices until a run breaks.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
