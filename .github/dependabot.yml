# Keeps dependencies current without letting them drift silently.
#
# Every update arrives as a pull request that CI builds, type-checks, lints and tests before it can
# merge — which is the point: "up to date" is only safe when something proves the update works
# first. Patch and minor updates are batched into one PR a week so routine currency costs one
# review; major updates are deliberately excluded (see below) because each one is a migration.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole safe batch rather than a stream of single-package PRs.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors are deliberately NOT ignored. Each arrives as its own pull request, which CI builds,
    # type-checks, lints and tests before it can merge — so the cost of one that does not work is a
    # red check, not a broken app. Three are known to be blocked upstream as of September 2026, and
    # the point of letting them through is that Dependabot will say so the day that changes:
    #
    #   eslint 10           eslint-plugin-jsx-a11y peers ^9 (the one npm stops on), and behind it
    #                       eslint-plugin-react peers ^9.7. eslint-plugin-react-hooks already
    #                       peers ^10, so it is those two that decide when this can move.
    #   @vitejs/plugin-     pulls @rolldown/plugin-babel, whose @babel/plugin-transform-runtime 8
    #     react 6           wants @babel/core ^8 against the 7 the rest of the tree resolves
    #   typescript 7        typescript-eslint declares typescript >=4.8.4 <6.1.0
    #
    # Those PRs will fail to install until the upstream plugins catch up. That failure is the
    # signal, and it costs nothing; forcing any of them through with --legacy-peer-deps would buy
    # a version number at the price of a dependency tree npm itself calls potentially broken.
    #
    # A blocked major also shows up a second way, which reads like a separate problem and is not:
    # eslint and @eslint/js are versioned in lockstep and peer each other, so Dependabot's
    # single-package PR for either one fails on the other's 9. Neither can move until eslint 10
    # itself can, and merging them together does not help — jsx-a11y still refuses. Verified.
    #
    # vite 8 was on that list and came off it: every plugin here (plugin-react 5, vite-plugin-pwa,
    # vitest 5) already peers ^8, so vite 8 installs, builds, lints and tests clean on its own.
    # Only plugin-react 6 is still stuck, and it is stuck on Babel rather than on Vite — which is
    # exactly the distinction a blanket "vite 8 is blocked" note would have gone on hiding.
    commit-message:
      prefix: deps

  # The workflow's own actions age too, and a pinned action that stops being maintained is the
  # kind of thing nobody notices until a run breaks.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
